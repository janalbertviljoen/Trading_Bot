  ["Company samples", "12 samples, each leaving out a random tenth of the companies", "S&P 500: ahead of the index in 12 of 12", "Passed on the S&P 500"],
  ["Unseen companies", "The score frozen, then run once on a tenth of the companies never used", "Positive, but two companies gave 99% of the gain (earlier sixteen-rule score)", "To rerun"],
  ["Other indices", "The score beats random picks of its own index on the S&P 400 and 600", "Not reproduced", "Open"],
  ["Two periods", "The edge appears before and after 2017", "Yes on the S&P 500 (earlier sixteen-rule score)", "To rerun"],
  ["Missed winners", "Which winners the score missed, and why", "Section [[sec:missed]]", "Done"],
  ["Survivorship", "The effect of companies that left the index", "Not yet measured", "Open"],
  ["Real-world check", "Results compared with market events and institutional logic", "Not yet done", "Open"],
]

[conclusions]
title = "Conclusions"
text = """In this sample, the value picks bought twice a year and held are worth more today than the \
same money in the {index} or in Berkshire Hathaway for each of the four start years. That describes \
the past under rules and settings chosen while looking at it; it is not a test of the strategy. \
The lead is uneven: the \
{best_company_buys} purchases of {best_company} make up {best_company_share} of the {ref_start} investor's \
value, and the purchases of {loss_years} trail the index.

Before the strategy is used, three steps are needed: the companies that left the index must be \
added to the data, the score must be tested on more decisions (each quarter instead of each \
year), and trading costs and taxes must be included."""

