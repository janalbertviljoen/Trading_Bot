# What each rule measures and when it passes; {name} placeholders are the rule's
# thresholds in config/rules.toml ([rules.<ID>], with [valuation] merged in).
[rule_texts.G2a]
measures = "Current assets divided by current liabilities: what the company owns against what it owes within a year."
passes = "at least {min_current_ratio}"

[rule_texts.G2b]
measures = "Long-term debt divided by net current assets (current assets less current liabilities)."
passes = "at most {max_debt_to_net_current_assets}"

[rule_texts.G3]
measures = "Number of the last {years} fiscal years with positive earnings per share."
passes = "all {years} years"

[rule_texts.G4]
measures = "Number of the {years} calendar years before the decision in which a dividend was paid."
passes = "all {years} years"

[rule_texts.G5]
measures = "Average earnings per share of the last {average_years} years over the average of the {average_years} years before them, within a window of {years} years."
passes = "at least {min_growth} times the earlier average"

[rule_texts.G6]
measures = "Price over the average earnings per share of the last {average_years} years."
passes = "at most {max_pe}"

[rule_texts.G7]
measures = "P/E as in G6 times the price over book value per share."
passes = "P/B at most {max_pb}, or the product at most {max_pe_times_pb}"

[rule_texts.E1]
measures = "Current ratio, as G2a."
passes = "at least {min_current_ratio}"

[rule_texts.E2]
measures = "Long-term debt over net current assets, as G2b."
passes = "at most {max_debt_to_net_current_assets}"

[rule_texts.E3]
measures = "Number of the last {years} fiscal years with positive earnings per share."
passes = "all {years} years"

[rule_texts.E4]
measures = "Dividends paid over the last {window_days} days, as a yield on the price."
passes = "any dividend"

[rule_texts.E5]
measures = "Change in earnings per share over {years} years, relative to the earlier figure."
passes = "earnings per share grew"

[rule_texts.E6]
measures = "Market value over net tangible assets (equity less goodwill and other intangible assets)."
passes = "at most {max_price_to_net_tangible_assets}"

[rule_texts.NN]
measures = "Market value over net current asset value (current assets less all liabilities)."
passes = "at most {max_price_to_ncav:.2f}"

[rule_texts.B1]
measures = "Number of the last {years} years with return on equity (net income over equity) of at least {min_roe:.0%}."
passes = "at least {min_years_passed} of those years, and long-term debt at most {max_debt_to_equity} times equity"

[rule_texts.NI1]
measures = "Growth of net income from the year before to the latest year."
passes = "net income grew"

[lookahead]
title = "Forward information"
text = """A score must use only what was known on its date. Four guards are built in. A \
company's figures count from the day its annual report was filed with the SEC, and of all \
the figures filed for a year only the first reported is used, never a later restatement. \
Prices are the close on the scoring date and dividends are counted by their ex-date. Each \
January and July purchase uses the scores of the rebalance date two weeks before it. Rule \
weights come from the companies on the date alone.

These guards are tested by cutting every input at a date as if it were that day (filings \
filed on or before it, prices and dividends up to it), scoring the companies again and \
comparing the scores with the full run (Table [[tab:lookahead]]). Any difference means \
information from after the date reached a score. On {lookahead_dates} the picks were \
{lookahead_picks}, and the scores were identical on {lookahead_clean}. The same check \
runs as a unit test. A rule whose window reaches back further than a company's price history \
(the 20-year dividend record of a younger company) is not evaluated rather than failed.

Three sources of forward information are outside this test. Only today's {index} members \
are scored. {membership} Companies that later left the index are missing, which flatters every \
result. Sectors are \
today's, used to leave out Financials and Real Estate in earlier years. And the score's \
design and settings were chosen while looking at 2016 to 2026, so no period tests it fairly: \
2022 onwards, once meant as a held-out test, was used to choose between models."""
survivors_title = "Companies missing from the data"
survivors_text = """Table [[tab:survivors]] counts the companies that left the {index} after each \
start year; none of them is in the data, of any sector. Most left through an acquisition, often at \
a premium; those that dropped out on their market value are the likely losers a real investor could \
have picked. The later the start, the fewer are missing, which is why the investor who started in \
{ref_start} is the reference of this report. The count starts with the index's list of changes, \
which begins in {record_start}: removals before that are not counted, so for earlier start years \
it understates the gap. The bias is removed only when the historical members of the index are \
added to the data."""
survivors_caption = "Companies that left the {index} since each start year, all missing from the data: in all, on their market value, and through an acquisition or another reason."
table_caption = "Truncation check: companies scored on the date, companies whose score differs when every input is cut at the date (per score), and whether the picks are the same."
