G6 = "P/E"
G7 = "P/E times P/B"
E1 = "current ratio (lenient)"
E2 = "debt to working capital (lenient)"
E3 = "5 years of profit"
E4 = "current dividend"
E5 = "4-year earnings growth"
E6 = "price to tangible assets"
NN = "net-net"
B1 = "return on equity"
NI1 = "net income growth"

