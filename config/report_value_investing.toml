# Text of the value-investing report (python -m Toolbox.value_investing report).
# Owned by the secretary: wording, structure and captions. The code places the tables and
# figures and fills the placeholders: {index} (the index's name, config/indices.toml),
# {end} (valuation date), {first_year}, {last_year},
# {picks} (companies per decision), {amount} (USD per decision); per start year s in 2016, 2020,
# 2023, 2025: {invested_s}, {wallet_s}, {sp_s}, {brk_s} (value today, USD), {wallet_rate_s},
# {sp_rate_s}, {brk_rate_s} (money-weighted return a year); {best_pick}, {best_year},
# {best_multiple} (best single purchase); {best_company}, {best_company_buys},
# {best_company_share} (the company worth most across its purchases, and its share of the
# 2016 investor's value); {winners}, {losers}, {winner_rules}, {loser_rules} (named from
# [rule_names]), {loss_years}; the wallet with sells: {managed_s}, {managed_rate_s},
# {threshold}, {first_start}, {sales}, {sold_usd}; next year: {next_score_date},
# {next_picks}, {worst_count}, {worst_list}. Inline maths between $...$;
# write { and } inside texts as {{ and }}.

title = "Value investing: buy-and-hold results"
abstract = """Each January and July since {first_year}, a rule-based value score picks {picks} \
{index} companies, and {amount} USD is invested in them, weighted by score and never sold. \
Investors who started in 2016, 2020, 2023 and 2025 (an earlier start buys from {first_year}) are \
followed to {end}, each against the same money in {benchmark_name}, and in Berkshire Hathaway. \
The reference is the investor who started in {ref_start}: the data hold only today's index \
members, and by the index's list of changes, which starts in {record_start}, {ref_removed} \
companies have left the index since then against {first_removed} since {first_year_start}, so \
fewer failed companies are missing. That investor's {ref_invested} USD is worth {ref_wallet} USD, \
against {ref_sp} USD in the benchmark and {ref_brk} USD in Berkshire Hathaway; a second wallet \
that also sells holdings whose score has fallen is worth {ref_managed} USD. The report closes with \
the next picks: {next_picks}. The result rests on few decisions and few companies, with \
{best_company_share} of the value in one \
company; it is a research result, not evidence of a lasting edge."""

[method]
title = "Method"
text = """Company fundamentals are the values first reported in each annual report (10-K) to the SEC, \
used from the day they were filed. When a company reports an item under more than one label, \
the label it used most recently by the date is taken, so later filings never decide it \
(Appendix [[app:lookahead]]). \
Prices and dividends are from Yahoo Finance; returns include reinvested dividends and are in US \
dollars. On each date, only companies already in the {index} are considered, outside the \
Financials and Real Estate sectors.

Ten rules from Graham and Buffett grade every company: G6 and G7 (price against earnings and book \
value), G2a and E1 (current ratio), G2b and E2 (debt), NN (net-net), G5 (earnings growth), B1 \
(return on equity) and E4 (current dividend). Six more (G3, G4, E3, E5, E6 and NI1) are switched \
off and can be switched on. For each rule, \
the companies are ranked by the rule's value and placed in six equal groups, from 5 points for the \
best sixth to 0 for the worst; each rule's points are multiplied by its weight, one less the share \
of companies that pass the rule's threshold, so rules few companies pass count more. The score is \
the sum. On the first trading day of January and of July, the {picks} highest-scoring companies are bought \
for {amount} USD, each in proportion to its score.

Three limits apply to every number in this report. Companies that left the index are missing from \
the data, which flatters the results. The score's design and every setting of this report (the \
rules and their weighting, the number of picks, the decision months, the sell threshold, the start years) were \
chosen while looking at the whole period from 2016, so no period here is out of sample: the \
results describe how these rules would have done, not evidence that they will do so. There are no \
trading costs or taxes."""

[picks]
title = "Picks per half-year"
text = """Table [[tab:picks]] lists the companies bought each January and July, with their weights, and what each \
{amount} USD is worth on {end}, next to the same money in the {index} and in Berkshire Hathaway. \
Figure [[fig:yearly]] shows the same values. Most of the money went to {top_sectors}; \
the best single purchase is {best_pick} in {best_year}, now worth \
{best_multiple} times its cost. The purchases of {loss_years} are worth less today than the same \
money in the {index}. Appendix [[app:purchases]] lists every purchase of the wallet with sells of \
the investor who started in {first_start}, with its price at purchase and today, what later sales \
took from it, what it keeps today and its total return with dividends."""
table_caption = "Purchases per half-year and their value today (USD)."
figure = "What each purchase is worth today, by date of purchase, on a logarithmic scale."

[value]
title = "Value over time"
text = """Table [[tab:value]] and Figure [[fig:value]] follow the four investors. Each puts in {amount} USD every January and July \
from the start year; the value wallet never sells. The return a year is money-weighted: the \
constant yearly rate that turns the payments into today's value.

The investor who started in 2016 earns {wallet_rate_2016} a year against {sp_rate_2016} in the \
{index} and {brk_rate_2016} in Berkshire Hathaway. From 2020 the rates are {wallet_rate_2020}, \
{sp_rate_2020} and {brk_rate_2020}; from 2023 {wallet_rate_2023}, {sp_rate_2023} and \
{brk_rate_2023}; from 2025, over less than two years, {wallet_rate_2025}, \
{sp_rate_2025} and {brk_rate_2025}. The wallet's value swings more than either comparison, because \
{picks} companies of a few industries are far less diversified than the index or Berkshire.

The value wallet with sells buys the same picks with the same money, but at each decision it also \
sells part of any holding whose score has fallen; Section [[sec:selling]] describes the rule. From \
2016 it is worth {managed_2016} USD ({managed_rate_2016} a year), from 2020 {managed_2020} USD \
({managed_rate_2020}) and from 2025 {managed_2025} USD ({managed_rate_2025})."""
table_caption = "Money put in and value today per start year (USD), and the money-weighted return a year."
figure = "Value of 100 USD every January and July from each start year, in USD, next to the money put in; the {index} dashed and Berkshire Hathaway dash-dot."

[selling]
title = "Selling below the threshold"
text = """Each January and July, before buying, the wallet with sells checks every company it holds. The \
score is put on a scale from 0 to 1, the share of the most the company could score on the rules \
it is measured on. A holding scoring {threshold} or less is sold in part: the share sold is \
({threshold} less the score) divided by {threshold}, so all of it at a score of 0 and almost none \
just under {threshold}. Holdings are sold, never sold short. The proceeds are added to the decision's \
{amount} USD and buy its picks."""
table_caption = "Sales of the investor who started in {first_start}: share of each holding sold, its score on the 0-to-1 scale, and the proceeds."
sold_title = "Sold in the wallet"
sold_text = """Table [[tab:sales]] lists the {sales} sales of the investor who started in {first_start}, worth {sold_usd} USD in \
all. They are the wallet's own cash flows; the list below does not depend on what anyone holds."""
worst_title = "To sell or short"
worst_caption = "The {worst_count} lowest-scoring companies on the latest score date, as many as the picks: sector, score, score on the 0-to-1 scale and what the score suggests."
worst_text = """These are the {worst_count} lowest scores in the {index} on {next_score_date}, as many as the picks, whether \
or not anyone holds them: {worst_list} (Table [[tab:worst]]). The last column reads each score on the 0-to-1 scale \
against the sell threshold of {threshold}. At or below the threshold, the company is one to avoid, and to \
hold only if you already own it. At or below half of the threshold, it is one to start thinking about selling. \
At zero, the score is not worth anything. The cut-offs are those the score uses today and are not fixed. The \
wallet never sells short; a short position on these companies is a later step and has not been tested."""

[contents]
title = "Wallet contents"
text = """Figure [[fig:contents]] follows every company in the wallet with sells of the investor \
who started in {first_start}, month by month. A line starts or steps up when the company is \
bought, steps down when part of it is sold, and rises or falls with the price in between. The \
dashed lines follow the same money in the {index} and in Berkshire Hathaway, divided by the number \
of companies the wallet holds on the date, so they show what one holding would be worth in the \
index or in Berkshire. Appendix [[app:contents]] gives each holding's value after every January's \
trades, the money put in and the proceeds of sales."""
figure = "Value of each holding in the wallet with sells (solid) and of the {index} and Berkshire Hathaway divided by the number of holdings (dashed), in USD on a logarithmic scale."
appendix_title = "Wallet contents by year"
table_caption = "Wallet with sells of the investor who started in {first_start}: value of each holding after each January's trades and today (USD), and the money put in and the proceeds of sales to date, July decisions included."

[rules]
title = "Rules behind the winners"
text = """Of the picks, {winners} have done better than the {index} since their purchase and \
{losers} have not, but a count treats a large win and a small loss alike. Table [[tab:dollars]] \
weighs them in dollars: each pick's value today less what the same money would be worth in the \
{index}. The winners are {winners_usd} USD ahead of the index and the laggards {losers_usd} USD \
behind, a net {net_usd} USD, the wallet's whole lead over the index. The median winner is \
{winners_median} USD ahead and the median laggard {losers_median} USD behind; the average win is \
{payoff} times the average loss. The wins are concentrated: the {top_n} largest, {top_picks}, make \
up {top_share} of the winners' total.

Figure [[fig:rules]] compares the mean points per rule of the winners and of the laggards on the day they \
were picked, each pick weighted by its dollars ahead or behind the index, so the large wins and \
losses count most; the rules are ordered by how much more the winners scored. The winners scored \
most above the others on {winner_rules}; the picks that lagged scored higher on {loser_rules}. With \
so few picks, these differences describe this sample; they do not establish which rules work. \
Appendix [[app:rules]] explains each rule, and Appendix [[app:weighting]] tests whether the rule \
weights favour the rules that told winners from losers."""
table_caption = "Dollars ahead of the same money in the {index}, per pick: total, average and median of the picks that beat the index and of those that lagged it."
figure = "Mean points per rule (0 to 5) of the picks that beat the {index} since purchase and of those that did not, each pick weighted by its dollars ahead or behind the index."
list_title = "The rules"
list_caption = "The rules: what each measures, the better direction and when a company passes."
list_text = """Table [[tab:rules]] explains each rule: what it measures, whether a higher or a lower value \
earns more points, and when a company passes it. The points come from the company's rank on the \
measure among all companies on the date; the pass threshold sets the rule's weight. Rules G \
follow Graham's defensive investor (The Intelligent Investor, chapter 14), rules E his \
enterprising investor (chapter 15) and his net-net test (NN), B1 Buffett's return on equity, and \
NI1 was added for net income growth. Two pairs test the same measure at different strictness \
(G2a and E1, G2b and E2), so the current ratio and debt count twice."""

[weighting]
title = "Testing the weighting"
text = """Each rule's points are multiplied by its weight, one less the share of companies passing \
it on the date, so a rule few companies pass counts more. A good weighting gives most weight to the \
rules whose points went with better returns. Table [[tab:weighting]] sets each rule's mean weight on the dates the \
picks were made against two measures of how well it told the {picks_n} picks apart: the gap \
between the mean points of the picks that beat the {index} and of those that did not, weighted by \
dollars as in Figure [[fig:rules]], and the rank \
correlation of the rule's points with each pick's return a year above the {index}. Figure [[fig:weighting]] plots \
weight against gap; a good weighting puts its rules on a rising line, with the heavy rules above \
zero.

Across the rules, the rank correlation of weight and gap is {quality_gap}, and of weight and \
correlation {quality_ic}."""
table_caption = "Each rule's weight w_r on the picks' dates (overall, for the picks that beat the {index} and for the others), the dollar-weighted mean points, the gap and the rank correlation with the return a year above the {index}."
figure = "Each rule's mean weight against the gap in points between the picks that beat the {index} and the others, weighted by dollars; rules above the line told winners from losers."

[weighting.verdicts]
favours = """The weighting leans towards the rules that worked, though far from fully. Weighted \
heavily but with a negative gap: {overweighted}. A positive gap but a light weight: \
{underweighted}. A rule's weight hardly differs between the dates of winning and losing picks \
(columns w_r beat and w_r not), because it is set across all companies on a date, not per pick. \
These differences suggest where the weighting could be tuned; any change must be tested on years \
it was not fitted on."""
unrelated = """The weighting is unrelated to which rules worked. Weighted heavily but with a \
negative gap: {overweighted}. A positive gap but a light weight: {underweighted}. Any change to the \
weights must be tested on years it was not fitted on."""
against = """The weighting favours the rules that did not work. Weighted heavily but with a \
negative gap: {overweighted}. A positive gap but a light weight: {underweighted}. Any change to the \
weights must be tested on years it was not fitted on."""

[peers]
title = "The Magnificent 7"
text = """The best-known growth companies of the period, the {peer_label}, are rarely picked. On \
the latest score date {peer_best} ranks highest of them, {peer_best_rank} of {peer_companies} \
companies, and {peer_worst} lowest at {peer_worst_rank} (Table [[tab:peers]]). The rules are \
Graham's and Buffett's, written to avoid paying a high price for growth: Figure [[fig:peers]] shows \
that the {peer_label} score far fewer points than the picks on {peer_behind}, and more only on \
{peer_ahead}.

The same {amount} USD at each decision, split equally over the {peer_label} in the index on the \
date and never sold, is worth {peer_2016} USD from 2016 ({peer_rate_2016} a year), {peer_2020} USD \
from 2020 ({peer_rate_2020}) and {peer_2025} USD from 2025 ({peer_rate_2025}), against \
{wallet_2016}, {wallet_2020} and {wallet_2025} USD in the value wallet. The comparison picks the \
{peer_label} with hindsight: they are named for having been the winners of these years."""
table_caption = "The Magnificent 7 on the score: score and score on the 0-to-1 scale on the latest score date, rank among the companies scored then, and median rank on the dates of the decisions since 2016."
figure = "Mean points per rule (0 to 5) of the Magnificent 7 and of our picks on the decision dates since 2016, the rules ordered by how many more points the picks scored."

[history]
title = "Price history of the picks"
text = """Figure [[fig:pick-prices]] shows the share price of every company the investor who \
started in {pick_scenario} bought or sold, and of the next picks, over the last {pick_years} years. The price is \
split-adjusted and excludes dividends, as a price chart shows it; the companies run from the best to the worst price change over \
the {pick_years} years, given beside each name; when they do not fit on one page, only the {pick_ends} best and the {pick_ends} \
worst are shown. Each purchase is marked in green \
and each sale in red, at the price on the decision date; a larger marker means more money. Figure \
[[fig:trade-amounts]] gives the same trades in USD per company and decision date."""
prices_figure = "Share price (USD, split-adjusted, dividends excluded) over the last {pick_years} years, one panel per company, ordered from the best to the worst price change over the period; purchases (green) and sales (red) of the investor who started in {pick_scenario}, marker area in proportion to the USD traded."
amounts_figure = "USD bought (green, positive) and sold (red, negative) by the investor who started in {pick_scenario}, per company and decision date."

[next]
title = "The next picks"
text = """On the latest score date, {next_score_date}, the {picks} highest-scoring companies are \
{next_picks} (Table [[tab:next]]). Each would receive its share of the next decision's {amount} USD and of any \
proceeds from sales. The decision is taken on the first trading day of January with the scores \
known then, which include the annual reports filed until that day; these picks are a preview and \
may change. Figure [[fig:next-prices]] shows each pick's share price over the last {pick_years} years, \
with the earlier purchases of the investor who started in {pick_scenario} and the potential purchase \
at today's price."""
table_caption = "The next picks on the latest score date: score, score on the 0-to-1 scale, weight and USD of each 100 USD."
prices_figure = "Share price of each next pick (USD, split-adjusted, dividends excluded) over the last {pick_years} years: earlier purchases of the investor who started in {pick_scenario} in green, the potential purchase at the latest price in orange."
[missed]
title = "Winning picks we missed"
text = """No score picks every winner, and a winner is only known afterwards. Here the winners are the ten \
companies with the highest return above their index over the next 36 months, found with hindsight on every \
date. A book of ten companies that knew nothing would hold about 4% of them on the S&P 500, 9% on the S&P 400 \
and 5% on the S&P 600 (Table [[tab:missed]]). They are shown as a check on the rules, not as advice.

On the S&P 500 the score holds 10% of the winners and ranks them slightly above the median (0.55 on a scale \
from 0 to 1). It found the chip makers (Nvidia 0.91, Lam Research 0.96, Micron 0.91) and missed the growth \
platforms: Amazon 0.08, Netflix 0.23 and Constellation Brands 0.32. On the S&P 400 the winners score below the \
median (0.42): Paylocity 0.03, Repligen 0.16, Tenet 0.17 and Qualys 0.20. Health care is 17% of the winners \
there and 3% of our picks. On the S&P 600 energy companies are 24% of the winners and 2% of our picks.

The likely cause is in the rules. They are Graham's and Buffett's, and they reward cheap, low-debt, asset-rich \
companies. Many winners of the period were growth and quality companies that pay no dividend and trade at \
higher multiples. On the S&P 400 they score 0.7 points lower than the average company on the dividend rule and \
0.4 lower on debt cover, while our picks score 4.4 on debt cover against 2.1 for the average company. Dropping \
the dividend rules made no measurable difference, so they are not what holds the score back; the price rules \
are the more likely cause (Section [[sec:dialogue]]). Companies that S&P later added to the S&P 500 scored \
lower than its existing members before they joined (0.42 against 0.51 on a scale from 0 to 1), which points the \
same way: the score undervalues growth."""
table_caption = "Winners over the next 36 months that the score missed, by index: the share of winners held (by chance), their mean score and examples with their score on a scale from 0 to 1."

[missed.table]
header = ["Index", "Winners held (by chance)", "Winners' mean score", "Missed winners and their score"]
columns = "l l l p{5.9cm}"
rows = [
  ["S&P 500", "10% (4%)", "0.55", "Amazon 0.08, Netflix 0.23, Constellation Brands 0.32, Adobe 0.48"],
  ["S&P 400", "5% (9%)", "0.42", "Paylocity 0.03, Repligen 0.16, Tenet 0.17, Qualys 0.20, Chemed 0.34"],
  ["S&P 600", "9% (5%)", "0.51", "Archrock 0.14, Brinker 0.16, SM Energy 0.19"],
]

[dialogue]
title = "Midas and the Investor"
text = """Every result in this report was questioned before it was believed. When something looked wrong, too \
good, different between indices or against what a long-term investor would say, Midas, who reads the numbers, \
put the question to the Investor. The Investor answers only from Warren Buffett's letters to shareholders and \
names the year. Midas then tested the answer and reported back. Three of the exchanges follow.

**Is the dividend rule holding the score back?**

**Midas:** The winners we missed mostly pay no dividend, and they score low on the dividend rules. Should we drop \
them?

**The Investor:** (1984) "Berkshire has earned well over market rates on retained earnings, thereby creating \
over one dollar of market value for every dollar retained. Under such circumstances, any distribution would have \
been contrary to the financial interest of shareholders, large or small."

**Midas:** I dropped the two dividend rules from the sixteen-rule score and compared. On the S&P 500 the best ten \
changed by -0.03 points a year, with a 99% band from -1.05 to +0.41; on the S&P 400 by -0.26. There is no \
measurable difference. The default now keeps only one dividend rule, the current dividend, and the other is a switch.

**Should a cheap price be the test of value?**

**Midas:** Dropping the P/E and price-to-book rules raised the best ten on the S&P 500 but lowered the broad \
ranking, and the missed winners were growth companies.

**The Investor:** (1992) "Growth is always a component in the calculation of value." A low ratio of price to book \
value, a low price-earnings ratio or a high dividend yield are "far from determinative as to whether an investor \
is indeed buying something for what it is worth", and the opposite characteristics "are in no way inconsistent \
with a 'value' purchase". Yet "business growth, per se, tells us little about value". (2013) "Price is what you pay, \
value is what you get."

**Midas:** I tested a price-to-earnings-growth measure. On all three indices it widened the broad ranking a little \
and left the best ten slightly lower, within the noise. Used only for companies that pass the quality rule, return \
on equity, both rose on the S&P 500 and the S&P 400, by 0.3 to 1 point a year. That is small and adds complexity, \
so it is a switch and not the default.

**Is it too good to be true?**

**Midas:** The picks beat the index in all 12 samples that each left out a random tenth of the companies. That \
looks too good, so I removed the biggest winners as if they had never existed.

**The Investor:** (1987) "When shortages exist, however, even commodity businesses flourish", and "whenever \
shortages appear, the typical manager simply can't wait to expand capacity". (1989) "Time is the friend of the \
wonderful business, the enemy of the mediocre."

**Midas:** With the three largest winners removed (Applied Materials, Lam Research and Micron) the wallet \
still beat the index by 3.7, 1.9 and 2.1 points a year for the investors who started in 2016, 2020 and 2023; with \
five removed, by 0.3 to 2.3 points. The edge is real on the S&P 500 but thin, and it sits in chip and materials \
companies after 2009. On the S&P 400 it disappears without its three largest winners. Treat it with care.

**What this suggests for you.** Hold for years, not months. Hold ten companies and not five, since the concentration \
is the main risk. Treat one or two big winners as luck until they have been tested the same way. Switch rules on or \
off for the kind of company you want, and read the tests in Section [[sec:testing]] before relying on a number."""

[reading]
title = "Where to read more"
text = """Midas can work from the documents you give it. Download or bring the strategy literature you like, tell \
Midas the style, and it will answer from those pages and name the source. The Berkshire Hathaway letters are free \
to read on the company's site. Books are copyrighted: use your own copy. The list below is grouped by the kind of \
risk each approach accepts. It is a starting point only: the titles are given from general knowledge and have \
not been checked against the books, so check each one before relying on it."""
table_caption = "Strategy literature by risk profile."

[reading.table]
header = ["Profile", "Idea", "Reading"]
columns = "l p{4.5cm} p{5.6cm}"
rows = [
  ["Defensive", "Preserve capital; diversified, cheap, boring; index funds", "Graham, The Intelligent Investor (the defensive investor); Bogle, The Little Book of Common Sense Investing"],
  ["Core", "A wonderful company at a fair price, held for years", "The Berkshire Hathaway shareholder letters; Dorsey, The Little Book That Builds Wealth"],
  ["Value with a margin of safety", "Buy at a deep discount to value", "Graham (the enterprising investor); Klarman, Margin of Safety"],
  ["Quality growth", "Growth at a reasonable price, good management", "Fisher, Common Stocks and Uncommon Profits; Lynch, One Up on Wall Street"],
  ["Systematic value", "Rules, ranked", "Greenblatt, The Little Book That Beats the Market; Piotroski (2000), the F-score; Novy-Marx (2013), gross profitability"],
  ["Risk awareness", "Cycles and what can go wrong", "Marks, The Most Important Thing; Lakonishok, Shleifer and Vishny (1994), contrarian investment"],
]

[testing]
title = "How the model was tested"
text = """The score is judged only on what it did not know: companies and dates that were held out, against random \
picks of the same size, with the uncertainty stated and the number of designs tried counted. The tests follow a \
written protocol, and a test that failed is shown as failed. The numbers are from runs on 1 November 2026 on \
the ten default rules, with data as of 31 October 2026.

On the S&P 500 the picks beat the index in all 12 samples that each left out a random tenth of the companies, \
by 9 to 15 points a year on average depending on the start year, and by about 5 points in the worst sample. \
They still beat it with the three largest winners removed as if they had never existed (Applied Materials, \
Lam Research and Micron): by 3.7, 1.9 and 2.1 points a year for the investors who started in 2016, 2020 and \
2023, and by 8.9 for 2025. With five removed (adding Nucor and Nvidia) the margin shrinks to 0.3 to 2.3 points \
for the first three. The edge is real on this index but thin, and concentrated in chip and materials companies \
that did well in a long bull market after 2009.

The other two indices do not confirm it. On the S&P 400 the picks beat their fund by 2 to 5 points a year for the \
2016 to 2023 starts, and with the three largest winners removed the margin is gone (0.4, -0.4 and -0.1). On the \
S&P 600 the investors who started in 2016 and 2020 are ahead by about 6 points, which survives the removal of \
the three largest winners, while those who started in 2023 and 2025 trail the fund. The lists of the S&P 400 and \
600 give no entry dates and lose the companies that grew into a larger index, so these two tests are biased and \
not yet a verdict on the rules. Companies that left the index are missing from every test, which flatters the \
results."""
table_caption = "The tests the model must pass before launch, and where each stands."

[testing.table]
header = ["Test", "What is checked", "Result", "Status"]
columns = "l p{3.6cm} p{4.6cm} p{2.3cm}"
